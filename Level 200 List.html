    <html lang="en">

            <meta charset="utf-8" />

            <title>BeluGANG List</title>
            <style>
            :root{
                --bg:#202120; --card:#23272b; --muted:#aeb8c2; --accent:#7c3aed;
                --glass: rgba(255,255,255,0.04);
                --card-radius:12px;
                --banner-height:84px;
            }
        body{font-family:Inter,system-ui,Segoe UI,Arial;background:var(--bg);color:#e6eef8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0} 
        .container{width:100%;max-width:1100px;padding:0} 
  h1{font-size:1.6rem;margin:0 0 18px;color:#e6eef8}
  .banner{position:fixed;top:0;left:0;min-width:100%;max-width:max-content;height:var(--banner-height);background:#111216;padding:0;border-radius:0;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,0.6)}
  .banner-inner{position:relative;max-width:1100px;margin:0 auto;padding:0 16px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
  /* level title: slightly smaller and lifted */
  .banner-inner h1{position:absolute;left:50%;transform:translate(-50%,-4px);font-size:1.2rem;white-space:nowrap;margin:0}
  /* organization name: larger */
  .banner-inner .org{font-weight:900;color:#e6eef8;font-size:1.6rem;padding-left:6px;padding-right:8px}
  
  .controls select{
    -webkit-appearance:none;
    -moz-appearance:none;
    appearance:none;
    background: linear-gradient(180deg,#2c3136,#26292c);
    color:#e6eef8;
    border:1px solid rgba(255,255,255,0.08);
    padding:8px 40px 8px 12px;
    border-radius:10px;
    min-width:160px;
    font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,0.45);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' stroke='%23e6eef8' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M2 6l6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:12px;
    transition:transform .12s ease, box-shadow .12s ease;
    cursor:pointer;
  }
  /* ensure options use dark background and light text when the dropdown opens */
  .controls select option{ background:#2c3136; color:#e6eef8 }
  /* Windows specific: hide native expand icon */
  .controls select::-ms-expand{ display:none }
  .controls select:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,0.5)}
  .controls select:focus{outline:none;box-shadow:0 0 0 4px rgba(124,58,237,0.12)}
  /* dataset toggle tabs */
  .dataset-toggle{display:inline-flex;gap:8px;align-items:center;margin-right:10px}
  .dataset-btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#e6eef8;padding:6px 10px;border-radius:8px;font-weight:600;cursor:pointer}
  .dataset-btn.active{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.12)}
  .toggle-btn[disabled]{opacity:0.5;cursor:default}

  /* staff grouping */
  .group-section{margin-top:18px}
  .group-title{font-weight:800;font-size:1rem;color:#e6eef8;margin:6px 0 14px;text-align:center;position:relative;padding:6px 0}
  .group-title::before, .group-title::after{content:'';position:absolute;top:50%;height:1px;background:rgba(255,255,255,0.04);width:30%;transform:translateY(-50%)}
  .group-title::before{left:0}
  .group-title::after{right:0} 
  .staff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:24px;grid-auto-rows:1fr}
  .staff-grid .card{height:100%;box-sizing:border-box}
  .staff-grid .card{min-height:140px}
  /* role pill should appear under the ID, not centered inline; remove decorative lines */
  .card.staff-owner .stats, .card.staff-cm .stats, .card.staff-sr .stats, .card.staff-mod .stats{justify-content:flex-start}
  .card.staff-owner .stats::before,.card.staff-owner .stats::after,.card.staff-cm .stats::before,.card.staff-cm .stats::after,.card.staff-sr .stats::before,.card.staff-sr .stats::after,.card.staff-mod .stats::before,.card.staff-mod .stats::after{display:none}
  .meta{display:flex;flex-direction:column}
  .stats{margin-top:8px}
  /* centered card highlight: outline only (no permanent shadow); hover/focus still lifts like other cards */
  .staff-grid .card.centered-card{outline:1px solid rgba(255,255,255,0.03);box-shadow:none;margin-top:0;margin-bottom:0;transition:transform .22s, box-shadow .22s, width .22s}
  /* ensure centered cards animate width changes and still lift on hover */
  .staff-grid .card.centered-card:hover, .staff-grid .card.centered-card:focus-within{transform:translateY(-6px);box-shadow:0 12px 30px rgba(0,0,0,0.6)}
  /* owner span keeps natural size (span 2 columns) */
  .staff-grid .card.owner-span{grid-column:span 2}
  @media (min-width:920px){
    /* at larger widths, enforce owner card min width equal to two columns so it looks long */
    .staff-grid .card.owner-span{min-width:calc(2 * 420px + 24px);}
  }
  /* role-specific plates */
  .card.staff-owner{padding:22px;border-radius:14px;background:linear-gradient(180deg,#111316,#15181b)}
  .card.staff-owner .avatar{width:88px;height:88px;font-size:22px;flex:0 0 88px}
  .card.staff-owner .pill{padding:8px 10px;font-size:0.92rem;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block}

  .card.staff-cm{padding:18px;border-radius:13px}
  .card.staff-cm .avatar{width:72px;height:72px;font-size:20px;flex:0 0 72px}
  .card.staff-cm .pill{padding:7px 10px;font-size:0.9rem;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block}

  .card.staff-sr{padding:16px;border-radius:12px}
  .card.staff-sr .avatar{width:64px;height:64px;font-size:18px;flex:0 0 64px}
  .card.staff-sr .pill{padding:7px 10px;font-size:0.9rem;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block}

  .card.staff-mod .avatar{width:56px;height:56px;font-size:16px;flex:0 0 56px}
  .card.staff-mod .pill{padding:6px 10px;font-size:0.88rem;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block}

  /* staff role badges (right) */
  .staff-badge{position:absolute;top:12px;right:12px;border-radius:999px;padding:6px 10px;font-weight:800;font-size:0.85rem}
  .role-owner{background:linear-gradient(180deg,#FFEB99,#FFD54F);color:#111827}
  .role-cm{background:linear-gradient(180deg,#D8B4FE,#B794F4);color:#111827}
  .role-sr{background:linear-gradient(180deg,#E1A17A,#D98845);color:#111827}
  .role-mod{background:linear-gradient(180deg,#ffffff,#e6e6e6);color:#111827}

  /* pill colors for staff roles (used under ID) */
  .pill.role-owner{background:linear-gradient(180deg,#ffffff,#e6e6e6);color:#111827}
  .pill.role-cm{background:linear-gradient(180deg,#ff6b6b,#ff3b3b);color:#ffffff} 
  .pill.role-admin{background:linear-gradient(180deg,#ff6b6b,#ff3b3b);color:#ffffff}
  .pill.role-sr{background:linear-gradient(180deg,#0f6b44,#0a4f34);color:#ffffff}
  .pill.role-mod{background:linear-gradient(180deg,#79c99a,#5fbf7f);color:#111827}

  /* title wrapper and dataset triangles (absolute so they don't shift) */
  .banner-inner h1 .title-wrap{position:absolute;left:50%;transform:translate(-50%,-4px);width:320px;display:block;min-width:240px}
  .banner-inner h1 .title-wrap .title-text{display:block;text-align:center;width:100%;font-weight:700}
  .dataset-tri{
    background:transparent;
    border:none;
    padding:0;
    width:0;
    height:0;
    display:inline-block;
    vertical-align:middle;
    transform-origin:center;
    transition:transform .22s cubic-bezier(.2,.9,.2,1), opacity .16s, border-color .16s;
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .dataset-tri.left{left:12px;border-top:11px solid transparent;border-bottom:11px solid transparent;border-right:14px solid #e6eef8;margin:0}
  .dataset-tri.right{right:12px;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:14px solid #e6eef8;margin:0}
  .dataset-tri.active.left{border-right-color:#ffffff}
  .dataset-tri.active.right{border-left-color:#ffffff}
  /* hover + focus styles: subtle by default (scale + gentle glow) */
  .dataset-tri:hover{opacity:0.95;transform:translateY(-50%) scale(1.06)}
  .dataset-tri:focus-visible{outline:none;box-shadow:0 0 0 6px rgba(255,255,255,0.06);border-color:#ffffff;transform:translateY(-50%) scale(1.12)}
  /* keep low-impact active state for click */
  .dataset-tri:active{transform:translateY(-50%) scale(1.06)}
  @media(max-width:520px){ .banner-inner h1 .title-wrap{width:220px} }

  /* board switch animations */
  #board{transition:opacity .36s ease, transform .36s cubic-bezier(.2,.8,.2,1)}
  #board.fade-out{opacity:0;transform:translateY(8px);pointer-events:none}
  #board.fade-in{opacity:1;transform:translateY(0)}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .container{width:100%;max-width:1100px;padding:0 16px;padding-bottom:48px;margin:calc(var(--banner-height) + 20px) auto 0}  
  .grid{display:grid;grid-template-columns:1fr;gap:22px}
  .card{
    background: rgba(35,39,43,0.96);
    border:1px solid rgba(255,255,255,0.04);
    padding:18px;border-radius:12px;position:relative;overflow:visible;
    transition:transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease, margin .18s ease, width .22s ease;
    display:flex;flex-direction:column;align-items:stretch;box-sizing:border-box;
  }
  .card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:12px 0 0 12px;background:transparent;transition:background-color .18s ease;
  }
  .card.rank-1::before{background:linear-gradient(180deg,#FFD700,#FFC107)}
  .card.rank-2::before{background:linear-gradient(180deg,#C0C0C0,#A8A8A8)}
  .card.rank-3::before{background:linear-gradient(180deg,#CD7F32,#B87333)}
  .card:focus-within, .card:hover{transform:translateY(-6px);box-shadow:0 12px 40px rgba(2,6,23,0.6)}

  .card.show-desc{margin-bottom:12px}
  .card-header{display:flex;gap:14px;align-items:center}
  .avatar{
    width:64px;height:64px;border-radius:50%;flex:0 0 64px;overflow:hidden;border:1px solid rgba(0,0,0,0.06);
    display:inline-grid;place-items:center;background:#ffffff;color:#111827;font-weight:700;font-size:18px;letter-spacing:0.6px
  }
  .meta{flex:1}
  .username{font-weight:700;font-size:1.05rem}
  .muted{color:var(--muted);font-size:0.9rem;margin-top:6px}
  .stats{display:flex;gap:10px;align-items:center;margin-top:12px}
  .pill{background:rgba(255,255,255,0.03);padding:8px 12px;border-radius:999px;font-weight:700;font-size:1.12rem;color:var(--muted)} 
  .months{color:var(--muted);font-size:0.9rem}

  /* description inner animation */
  .desc{padding:0;max-height:0;overflow:hidden;border-radius:10px;background:transparent;border:1px solid transparent;color:#e6eef8;font-size:0.92rem;line-height:1.5;transition:max-height .32s ease;padding-top:0;padding-bottom:0}
  .desc-inner{opacity:0;transform:translateY(6px);transition:opacity .22s ease, transform .22s ease}
  .desc-inner.centered{ text-align:center }
  .card.show-desc .desc{background:#222323;border:1px solid rgba(255,255,255,0.04);padding:12px;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,0.45);}
  .card.show-desc .desc-inner{opacity:1;transform:translateY(0)}

  /* reveal-on-scroll animation */
  .reveal{opacity:0;transform:translateY(12px);transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1)}
  .reveal.visible{opacity:1;transform:translateY(0)}

  /* rank badge and gradient colors */
  .rank-badge{
    position:absolute;
    top:12px;
    right:12px;
    background:linear-gradient(180deg,#ffffff,#e6e6e6);
    color:#111827;
    padding:6px 10px;
    border-radius:999px;
    font-weight:700;
    font-size:.85rem;
    box-shadow:0 2px 8px rgba(0,0,0,0.18);
    border:1px solid rgba(0,0,0,0.06);
    min-width:44px;
    text-align:center;
  }
  .card.rank-1 .rank-badge{background:linear-gradient(180deg,#FFEB99,#FFD54F); color:#111827}
  .card.rank-2 .rank-badge{background:linear-gradient(180deg,#F0F0F0,#CFCFCF); color:#111827}
  .card.rank-3 .rank-badge{background:linear-gradient(180deg,#F3C08A,#E29A5A); color:#111827}

  /* clickable ID (copies to clipboard) */
  .id-link{background:transparent;border:1px solid rgba(255,255,255,0.04);color:#e6eef8;padding:4px 8px;border-radius:6px;font-weight:700;cursor:pointer;font-family:inherit}
  .id-link:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,0.35)}
  .id-link:focus{outline:3px solid rgba(124,58,237,0.12);outline-offset:2px}
  /* placeholder for missing/deleted IDs (non-interactive pill) */
  .id-missing{
    display:inline-block;
    padding:4px 10px;
    border-radius:6px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.02);
    color:#e6eef8;
    font-weight:700;
    font-size:0.92rem;
    line-height:1;
    vertical-align:middle;
    cursor:default;
  } 

  /* small screens */
  @media (max-width:520px){.grid{grid-template-columns:1fr}.avatar{width:52px;height:52px;font-size:16px}}
  /* focus outline for keyboard */
  .card:focus{outline:3px solid rgba(124,58,237,0.12);outline-offset:4px}

<script>
    function discordDefaultAvatar(id) {
  if (!id || id === 'Deleted') return null;
  // only accept numeric Discord IDs to avoid throwing when a placeholder like '-' is used
  if(!/^[0-9]+$/.test(String(id))) return null;
  try{
    const i = Number((BigInt(id) >> 22n) % 6n);
    return `https://cdn.discordapp.com/embed/avatars/${i}.png`;
  }catch(e){ return null; }
    }

    // stable fallback avatar when ID is missing or non-numeric; hashes a seed (name or id) to one of the 6 Discord default avatars
    function getFallbackDiscordAvatar(seed){
  const s = String(seed || '').trim() || 'fallback';
  let n = 0;
  for(let i=0;i<s.length;i++) n = (n*31 + s.charCodeAt(i)) >>> 0;
  const idx = n % 6;
  return `https://cdn.discordapp.com/embed/avatars/${idx}.png`;
    }

    // show a small, persistent error overlay for runtime errors so we can see why rendering fails
    function showErrorOverlay(msg){
      try{
        let ov = document.getElementById('error-overlay');
        if(!ov){ ov = document.createElement('div'); ov.id = 'error-overlay'; document.body.appendChild(ov); }
        ov.textContent = '';
        const header = document.createElement('strong'); header.textContent = 'Runtime error'; ov.appendChild(header);
        const br = document.createElement('div'); br.style.marginTop = '6px'; br.style.whiteSpace = 'pre-wrap'; br.textContent = String(msg).slice(0,200); ov.appendChild(br);
      }catch(e){ console.warn('showErrorOverlay failed', e); }
    }

    window.addEventListener('error', (ev)=>{ console.error(ev); try{ showErrorOverlay(`${ev.message} — ${ev.filename}:${ev.lineno}`); }catch(e){} });
    window.addEventListener('unhandledrejection', (ev)=>{ console.error(ev); try{ showErrorOverlay(`Unhandled rejection: ${ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason)}`); }catch(e){} });

    // setup search control behaviour
    function setupSearch(){
      try{
        const sb = document.getElementById('searchBox');
        if(!sb) return; 
        let searchResults = [];
        let searchIndex = -1;
        function highlightSearch(q){
          document.querySelectorAll('.card.search-match').forEach(c=>c.classList.remove('search-match'));
          document.querySelectorAll('.card .username.search-hit').forEach(n=>n.classList.remove('search-hit'));
          searchResults = [];
          searchIndex = -1;
          const ql = q.trim().toLowerCase();
          if(!ql) return;
          Array.from(document.querySelectorAll('.card .username')).forEach(n => {
            if((n.textContent || '').trim().toLowerCase().includes(ql)){
              const card = n.closest('.card');
              card.classList.add('search-match');
              n.classList.add('search-hit');
              searchResults.push(card);
            }
          });
          if(searchResults.length){ searchIndex = 0; }
        }
        sb.addEventListener('input', (e)=>{ highlightSearch(e.target.value); });
        sb.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); if(searchResults.length){ searchIndex = (searchIndex + 1) % searchResults.length; searchResults[searchIndex].scrollIntoView({behavior:'smooth', block:'center'}); searchResults[searchIndex].focus(); } } });


        // floating search UX: clicking the magnifier focuses the input; focus/blur updates aria-expanded and supports keyboard Escape to close
        const floatWrap = document.getElementById('float-search');
        const floatToggle = document.getElementById('floatSearchToggle');
        if(floatToggle && sb){
          floatToggle.addEventListener('click', ()=>{ sb.focus(); });
          sb.addEventListener('focus', ()=>{ floatToggle.setAttribute('aria-expanded','true'); if(floatWrap) floatWrap.classList.add('open'); });
          sb.addEventListener('blur', ()=>{ floatToggle.setAttribute('aria-expanded','false'); if(floatWrap) floatWrap.classList.remove('open'); });
          sb.addEventListener('keydown', (e)=>{ if(e.key === 'Escape'){ sb.value=''; highlightSearch(''); sb.blur(); } });
        }
      }catch(e){ console.warn('setupSearch failed', e); }
    }

// helper: parse time string "MM / DD"; treat '-- / --' as very slow and compute total days
function parseTime(t){
  if(!t || t.includes('--')) return {monthsNum: 1e6, daysNum: 1e6, totalDays: 1e9};
  const bits = t.split('/').map(s=>s.trim());
  const m = parseInt(bits[0],10);
  const d = parseInt(bits[1],10);
  const monthsNum = isNaN(m)?1e6:m;
  const daysNum = isNaN(d)?0:d;
  const totalDays = monthsNum * 30 + daysNum; // approximate months as 30 days
  return {monthsNum, daysNum, totalDays};
}

});

// helper to convert DD/MM/YYYY to a comparable number (YYYYMMDD)
function parseDateToNumber(dateStr){
  if(!dateStr) return 99999999;
  const parts = dateStr.split('/').map(s=>s.trim());
  if(parts.length !== 3) return 99999999;
  const d = parseInt(parts[0],10);
  const m = parseInt(parts[1],10);
  const y = parseInt(parts[2],10);
  if(isNaN(d) || isNaN(m) || isNaN(y)) return 99999999;
  return (y*10000) + (m*100) + d;
}

function getInitials(name){
  if(!name) return '';
  const parts = name.split(/\s+/).filter(Boolean);
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function formatTime(p){
  // show as "X months Y days" using parsed months and days
  if(!p || p.totalDays >= 1e9) return '--';
  const m = Number(p.monthsNum);
  const d = Number(p.daysNum);
  if(isNaN(m) || isNaN(d)) return '--';
  const parts = [];
  if(m > 0 && m < 1e6) parts.push(`${m} month${m === 1 ? '' : 's'}`);
  if(d > 0) parts.push(`${d} day${d === 1 ? '' : 's'}`);
  if(parts.length === 0) return '0 days';
  return parts.join(' ');
} 

// format a date string in dd/mm/yyyy into a human readable form like "1 February 2023"
function formatDateDisplay(dateStr){
  if(!dateStr) return '--';
  const parts = dateStr.split('/').map(s=>s.trim());
  if(parts.length !== 3) return dateStr;
  const d = parseInt(parts[0],10);
  const m = parseInt(parts[1],10);
  const y = parseInt(parts[2],10);
  if(isNaN(d) || isNaN(m) || isNaN(y)) return dateStr;
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const month = monthNames[m - 1] || '';
  return `${d} ${month} ${y}`;
}

function sortPeople(mode){
  if(mode === 'fastest'){
    people.sort((a,b)=> (a.monthsNum - b.monthsNum) || (a.daysNum - b.daysNum) || (parseDateToNumber(a.date) - parseDateToNumber(b.date)));
  } else if(mode === 'first'){
    people.sort((a,b)=> (parseDateToNumber(a.date) - parseDateToNumber(b.date)) || (parseInt(a.position,10) - parseInt(b.position,10)) || (a.id - b.id));
  }
}

      }
      function hideDesc(){
        card.classList.remove('show-desc');
        card.setAttribute('aria-expanded','false');
        desc.setAttribute('aria-hidden','true');
        descInner.style.opacity = 0; descInner.style.transform = 'translateY(6px)';
        desc.style.maxHeight = '0px';
      }

      card.addEventListener('mouseenter', showDesc);
      card.addEventListener('mouseleave', hideDesc);
      card.addEventListener('focusin', showDesc);
      card.addEventListener('focusout', hideDesc);
      card.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); const isOpen = card.classList.contains('show-desc'); if(isOpen) hideDesc(); else showDesc(); } });

      board.appendChild(card);
    }
    catch(err){
      console.error('renderBoard: failed to render person', p && p.name, p, err);
    }
  });

  // after rendering, update status and log summary for debugging
  try{
    const renderedNames = Array.from(board.querySelectorAll('.username')).map(n=>n.textContent && n.textContent.trim()).filter(Boolean);
    const count = renderedNames.length;
    console.log('renderBoard: rendered names count', count);
    const missing = (people || []).map(p=>p.name && p.name.trim()).filter(Boolean).filter(n => !renderedNames.includes(n));
    if(missing.length) console.warn('renderBoard: missing after render ->', missing);
  }catch(e){ /* noop */ }
}

// render staff with grouping and role-specific plates
function renderStaff(){
  board.innerHTML = '';
  const groupsOrder = ['Owner','Community Manager','Admin','Sr Moderator','Moderator'];
  const groups = {};
  staff.forEach(s => {
    const role = s.role || 'Moderator';
    const key = role.trim();
    if(!groups[key]) groups[key] = [];
    groups[key].push(s);
  });

  groupsOrder.forEach(groupName => {
    const members = groups[groupName];
    if(!members || members.length === 0) return;

    // sort alphabetically by name for easier lookup (case-insensitive)
    members.sort((a,b)=> a.name.localeCompare(b.name, undefined, {sensitivity:'base'}));

    // if odd number of members, move the last (lowest alphabetical) into the center for balance
    if(members.length % 2 === 1 && members.length > 1){
      const last = members.pop();
      const midIndex = Math.floor(members.length / 2);
      members.splice(midIndex, 0, last);
    }

    const sec = document.createElement('section');
    sec.className = 'group-section';
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = groupName;
    sec.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'staff-grid';

    members.forEach((p)=>{
      const card = document.createElement('article');
      card.className = 'card';
      // enable reveal-on-scroll animation
      card.classList.add('reveal');
      // role-specific modifier
      const roleKey = groupName.toLowerCase().startsWith('owner') ? 'staff-owner' : ( (groupName.toLowerCase().includes('community') || groupName.toLowerCase().includes('admin')) ? 'staff-cm' : (groupName.toLowerCase().includes('sr') ? 'staff-sr' : 'staff-mod'));
      card.classList.add(roleKey);
      card.setAttribute('role','listitem');
      card.dataset.id = p.id;
      // make the Owner card span two columns so it takes the full width
      if(groupName === 'Owner'){
        // span exactly 2 columns (keeps a long card similar to the Level 200 list)
        card.style.gridColumn = 'span 2';
        card.classList.add('owner-span');
      }

      // id rendering (staff: only show ID; no date)
      const rawId = (p.discordId || '').toString().trim();
      const idLower = rawId.toLowerCase();
      const missingSentinels = ['--','-','deleted','removed','n/a','null',''];
      const isMissing = missingSentinels.includes(idLower);
      const hasId = rawId && !isMissing;
      let idHtml;
      if(hasId){ idHtml = `<button class="id-link" aria-label="Copy ID ${rawId}">${rawId}</button>` } else { const display = (rawId && rawId !== '--') ? rawId : '—'; idHtml = `<span class="id-missing">${display}</span>`; }

      // pill role class mapping for colors
      const pillRoleClass = (roleKey === 'staff-owner') ? 'role-owner' : (roleKey === 'staff-cm' ? 'role-cm' : (roleKey === 'staff-sr' ? 'role-sr' : 'role-mod'));
      const roleLabel = p.role;

      card.innerHTML += `
        <div class="card-header">
          <div class="avatar" aria-hidden="true" aria-label="${p.name}"></div>
          <div class="meta">
            <div class="username">${p.name}</div>
            <div class="muted">ID: ${idHtml}</div>
            <div class="stats"><div class="pill ${pillRoleClass}">${roleLabel}</div></div>
          </div>
        </div>
      `;

      const avatar = card.querySelector('.avatar');

      // avatar selection for staff cards: prefer discord avatar when available; otherwise avoid pravatar placeholders and use deterministic discord fallback
      let avatarUrl = null;
      if (p.discordId && p.discordId !== 'Deleted') {
        avatarUrl = discordDefaultAvatar(p.discordId) || getFallbackDiscordAvatar(p.name || p.discordId);
      } else if (p.img && !/pravatar\.cc/.test(p.img)) {
        avatarUrl = p.img.replace('.webp', '.png');
      } else {
        avatarUrl = getFallbackDiscordAvatar(p.name || p.discordId);
      }

      if (avatarUrl) {
        avatar.style.backgroundImage = `url("${avatarUrl}")`;
        avatar.style.backgroundSize = 'cover';
        avatar.style.backgroundPosition = 'center';
        avatar.textContent = '';
      } else {
        avatar.textContent = initials;
      }

      // style the role pill according to role (Owner, Community Manager/Admin, Sr, Mod)
      const pillEl = card.querySelector('.pill');
      if(pillEl){
        if(groupName === 'Owner' || roleKey === 'staff-owner') pillEl.classList.add('role-owner');
        else if(groupName === 'Community Manager' || roleKey === 'staff-cm') pillEl.classList.add('role-cm');
        else if(groupName === 'Admin') pillEl.classList.add('role-admin');
        else if(roleKey === 'staff-sr') pillEl.classList.add('role-sr');
        else pillEl.classList.add('role-mod');
      }


      // attach copy handlers to ID buttons (header & desc) if any
      const idButtons = card.querySelectorAll('.id-link');
      idButtons.forEach(btn=>{
        btn.addEventListener('click', async (e)=>{
          try{ await navigator.clipboard.writeText(p.discordId); const orig = btn.textContent; btn.textContent = 'Copied'; setTimeout(()=> btn.textContent = orig, 1200); }catch(err){ console.error('copy failed', err); }
        });
      });



      grid.appendChild(card);
    });



    sec.appendChild(grid);
    board.appendChild(sec);

    // center any lone final card AFTER it has been inserted into the DOM
    requestAnimationFrame(()=>{
      try{
        const colStyle = window.getComputedStyle(grid).gridTemplateColumns || '';
        const cols = colStyle ? colStyle.trim().split(/\s+/).length : 1;
        if(cols > 1 && (grid.children.length % cols) === 1){
          const lastCard = grid.children[grid.children.length - 1];
          if(lastCard){
            // make it span the full row so we can center it, then constrain to exactly one column's width
            lastCard.style.gridColumn = '1 / -1';
            lastCard.style.justifySelf = 'center';

            if(!lastCard.classList.contains('staff-owner')){
              // compute single column width and set that width so the lone card matches cards above
              const gridRect = grid.getBoundingClientRect();
              const gap = parseFloat(window.getComputedStyle(grid).gap) || 0;
              const colWidth = Math.max(0, Math.floor((gridRect.width - (cols - 1) * gap) / cols));
              lastCard.style.width = colWidth + 'px';
              lastCard.style.maxWidth = colWidth + 'px';
              lastCard.style.margin = '0 auto';
              lastCard.style.alignSelf = 'stretch';
              lastCard.style.boxSizing = 'border-box';
            } else {
              lastCard.style.width = '';
              lastCard.style.maxWidth = '';
              lastCard.style.margin = '';
              lastCard.style.alignSelf = '';
            }

            lastCard.classList.add('centered-card');
          }
        } else {
          Array.from(grid.children).forEach(c => { c.classList.remove('centered-card'); c.style.gridColumn = ''; c.style.justifySelf = ''; c.style.maxWidth = ''; c.style.width = ''; c.style.margin = ''; c.style.alignSelf = ''; });
        }
      }catch(e){ /* noop */ }
    });
  });
}

// keep badges & left accents in sync with current DOM order
function updateRanks(){
  Array.from(board.children).forEach((c, i)=>{
    c.classList.remove('rank-1','rank-2','rank-3');
    if(i===0) c.classList.add('rank-1');
    else if(i===1) c.classList.add('rank-2');
    else if(i===2) c.classList.add('rank-3');
    const badge = c.querySelector('.rank-badge');
    if(badge) badge.textContent = `#${i+1}`;
  });
}

// Reorder with FLIP animation when sort mode changes
function reorderBoardWithAnimation(){
  // capture first positions
  const cards = Array.from(board.children);
  const firstRects = new Map();
  cards.forEach(c => { firstRects.set(c.dataset.id, c.getBoundingClientRect()); });

  // append in new order
  const data = (currentDataset === 'staff') ? staff : people;
  data.forEach(p => {
    const c = board.querySelector(`[data-id="${p.id}"]`);
    if(c) board.appendChild(c);
  });

  // update badges and left-accent classes to reflect new order (only for people list)
  if(currentDataset !== 'staff') updateRanks();

  // animate from old position to new
  const lastRects = new Map();
  const moved = [];
  Array.from(board.children).forEach(c => {
    const id = c.dataset.id;
    const first = firstRects.get(id);
    const last = c.getBoundingClientRect();
    lastRects.set(id, last);
    const deltaY = first ? first.top - last.top : 0;
    if(deltaY){
      moved.push({c, deltaY});
    }
  });

  moved.forEach(({c, deltaY}) => {
    c.style.transition = 'none';
    c.style.transform = `translateY(${deltaY}px)`;
    requestAnimationFrame(()=>{
      c.style.transition = 'transform .48s cubic-bezier(.2,.8,.2,1)';
      c.style.transform = '';
    });
    const cleanup = ()=>{ c.style.transition = ''; c.style.transform = ''; c.removeEventListener('transitionend', cleanup); };
    c.addEventListener('transitionend', cleanup);
  });
}

// reveal observer for scroll animations
let revealObserver = null;
function setupRevealObserver(){
  try{
    if(revealObserver) revealObserver.disconnect();
    revealObserver = new IntersectionObserver((entries, obs)=>{
      entries.forEach(entry => {
        if(entry.isIntersecting){
          // add a tiny delay and clear inline transition to ensure the CSS transition runs
          setTimeout(()=>{ try{ entry.target.style.transition = ''; entry.target.classList.add('visible'); }catch(e){} }, 25);
          obs.unobserve(entry.target);
        }
      });
    },{threshold:0.12});
    // ensure reveal elements already in the viewport show immediately; otherwise observe them
    document.querySelectorAll('.reveal:not(.visible)').forEach(el => {
      try{
        const r = el.getBoundingClientRect();
        const vh = window.innerHeight || document.documentElement.clientHeight;
        if(r.top < vh && r.bottom > 0){
          // small delay to ensure initial styles are applied; clear any inline transition and then add visible
          setTimeout(()=>{ try{ el.style.transition = ''; el.classList.add('visible'); }catch(e){} }, 25);
        } else {
          revealObserver.observe(el);
        }
      }catch(e){ revealObserver.observe(el); }
    });
  }catch(err){ /* noop */ }
}

// animate switching datasets with a smooth fade/slide
function animateDatasetSwitch(newDs){
  if(!board) { setDataset(newDs); return; }
  // prevent double toggles
  if(board.classList.contains('fade-out')) return;
  board.classList.add('fade-out');
  const onFade = (e)=>{
    if(e.propertyName !== 'opacity') return;
    board.removeEventListener('transitionend', onFade);
    setDataset(newDs);
    requestAnimationFrame(()=>{
      board.classList.remove('fade-out');
      board.classList.add('fade-in');
      const onIn = (ev)=>{ if(ev.propertyName !== 'opacity') return; board.removeEventListener('transitionend', onIn); board.classList.remove('fade-in'); };
      board.addEventListener('transitionend', onIn);
    });
  };
  board.addEventListener('transitionend', onFade);
}

// Bottom banner: full-width footer that appears when the user reaches the bottom; instant, extra slim, text lifted
;(function(){
  const css = `
  /* footer banner styles (visible and more prominent) */
  .bottom-banner{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    display:none; /* hidden by default, shown instantly */
    z-index:200001;
    background:linear-gradient(180deg,#111216,#15171a);
    color:var(--muted);
    padding:0; /* compact */
    height:48px; /* more visible */
    border-top-left-radius:6px;
    border-top-right-radius:6px;
    border-top:1px solid rgba(255,255,255,0.04);
    box-shadow:0 -8px 20px rgba(0,0,0,0.28);
    display:flex;justify-content:center;align-items:center;font-weight:800;pointer-events:none;
  }
  .bottom-banner.show{ display:flex; }
  .bottom-banner .banner-inner{ width:100%; max-width:1100px; padding:0 16px; display:flex; align-items:center; justify-content:center; gap:12px; position:relative; height:52px; }
  .bottom-banner .text{ font-size:1.08rem; color:#e6eef8; font-weight:800; text-align:center; line-height:52px; transform:none; white-space:nowrap; overflow:visible; text-overflow:ellipsis; text-shadow:0 1px 0 rgba(0,0,0,0.35); }
  `;

  try{
    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

    const banner = document.createElement('div');
    banner.className = 'bottom-banner';
    banner.setAttribute('role','status');
    banner.setAttribute('aria-hidden','true');
    banner.innerHTML = `<div class="banner-inner container"><div class="text">Not an official list</div></div>`;
    document.body.appendChild(banner);

    // ensure the banner does not permanently hide important content by adding body padding equal to its height when visible
    function applyBodyPadding(){
      try{
        // add a small extra gap to ensure the last card never touches the banner (4px)
        const h = Math.round(banner.getBoundingClientRect().height) + 4;
        if(h && document.body.style.paddingBottom !== h + 'px') document.body.style.paddingBottom = h + 'px';
      }catch(e){}
    }

    function clearBodyPadding(){
      try{ if(document.body.style.paddingBottom){ document.body.style.paddingBottom = ''; } }catch(e){}
    }

    function throttle(fn, wait){ let last = 0, t = null; return function(...args){ const now = Date.now(); if(now - last >= wait){ last = now; fn.apply(this,args); } else { clearTimeout(t); t = setTimeout(()=>{ last = Date.now(); fn.apply(this,args); }, wait - (now - last)); } } }

    let visible = false;
    function checkScrollForBanner(){ const nearBottom = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 24); if(nearBottom){ if(!visible){ banner.classList.add('show'); banner.setAttribute('aria-hidden','false'); visible = true; // allow the transition to apply before measuring
            setTimeout(applyBodyPadding, 50);
          } else { // ensure padding remains correct
            applyBodyPadding();
          }
        } else {
          if(visible){ banner.classList.remove('show'); banner.setAttribute('aria-hidden','true'); visible = false; clearBodyPadding(); }
        } }

    window.addEventListener('scroll', throttle(checkScrollForBanner, 150), {passive:true});
    window.addEventListener('resize', throttle(()=>{ checkScrollForBanner(); if(visible) applyBodyPadding(); }, 250));
    // initial check after layout
    setTimeout(checkScrollForBanner, 240);
  }catch(e){ console.warn('bottom banner init failed', e); }
})();
    
/* Mobile double-tap toggle for card*/
(function setupMobileDoubleTap(){
  let lastTapTime = 0;
  let lastCard = null;
  const DOUBLE_TAP_DELAY = 350;

  // Only activate on touch devices
  if (!('ontouchstart' in window)) return;

  document.addEventListener('click', function (e) {
    const card = e.target.closest('.card');
    if (!card) return;

    const now = Date.now();

    // Close
    if (lastCard === card && (now - lastTapTime) < DOUBLE_TAP_DELAY) {
      e.preventDefault();
      card.classList.remove('show-desc');
      lastCard = null;
      lastTapTime = 0;
      return;
    }
    // Open
    lastTapTime = now;
    lastCard = card;
    // Delay
    setTimeout(() => {
      if (lastCard === card) {
        card.classList.add('show-desc');
      }
    }, DOUBLE_TAP_DELAY);
  }, true);
})();
