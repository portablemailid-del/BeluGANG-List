/* board switch animations */
#board {
  transition:opacity .36s ease,

}
#board.fade-out {
  opacity:0;transform:translateY(8px);pointer-events:none

  /* timeline view styles */
  #timeline {
    transition:opacity .36s ease, transform .36s cubic-bezier(.2, .8, .2, 1)
  }
  #timeline.fade-out {
    opacity:0;transform:translateY(8px);pointer-events:none
  }
  #timeline.fade-in {
    opacity:1;transform:translateY(0)
  }

  .timeline-year {
    font-size:1.5rem;
    font-weight:900;
    color:#e6eef8;

    border-bottom:2px solid rgba(255, 255, 255, 0.05);

  }
  .timeline-list {
    display:flex;

    gap:14px
  }
  .timeline-entry {
    background:rgba(35, 39, 43, 0.5);
    border:1px solid rgba(255, 255, 255, 0.04);
    border-radius:8px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    transition:background .18s ease, transform .18s ease, opacity .3s ease;
    opacity:0;
    transform:translateY(12px);
    animation:timelineEntryFadeIn .4s ease forwards;
  }
  .timeline-entry:nth-child(1) { animation-delay: 0.1s; }
  .timeline-entry:nth-child(2) { animation-delay: 0.15s; }
  .timeline-entry:nth-child(3) { animation-delay: 0.2s; }
  .timeline-entry:nth-child(4) { animation-delay: 0.25s; }
  .timeline-entry:nth-child(5) { animation-delay: 0.3s; }
  .timeline-entry:nth-child(6) { animation-delay: 0.35s; }
  .timeline-entry:nth-child(7) { animation-delay: 0.4s; }
  .timeline-entry:nth-child(8) { animation-delay: 0.45s; }
  .timeline-entry:nth-child(9) { animation-delay: 0.5s; }
  .timeline-entry:nth-child(10) { animation-delay: 0.55s; }

@keyframes timelineEntryFadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }

const board = document.getElementById('board');

function parseTime(t) {
  if (!t || t.includes('--')) return {
    monthsNum:1e6,
    daysNum:1e6,
    totalDays:1e9
  };
  const bits = t.split('/').map(s => s.trim());
  const m = parseInt(bits[0], 10);
  const d = parseInt(bits[1], 10);
  const monthsNum = isNaN(m) ? 1e6 : m;
  const daysNum = isNaN(d) ? 0 : d;
  const totalDays = monthsNum * 30 + daysNum; // approximate months as 30 days
  return {
    monthsNum,
    daysNum,
    totalDays
  };
}

people.forEach((p, i) => {
  const parsed = parseTime(p.time);
  p.monthsNum = parsed.monthsNum;
  p.daysNum = parsed.daysNum;
  p.totalDays = parsed.totalDays;
  p.totalDaysLabel = (p.totalDays >= 1e9) ? '--' : `${p.totalDays} days`;
  p.id = i + 1; // local id
  p.description = `Date: ${formatDateDisplay(p.date)} \nID: ${p.discordId} \nTime: ${formatTime(p)}`;
});

function parseDateToNumber(dateStr) {
  if (!dateStr) return 99999999;
  const parts = dateStr.split('/').map(s => s.trim());
  if (parts.length !== 3) return 99999999;
  const d = parseInt(parts[0], 10);
  const m = parseInt(parts[1], 10);
  const y = parseInt(parts[2], 10);
  if (isNaN(d) || isNaN(m) || isNaN(y)) return 99999999;
  return (y * 10000) + (m * 100) + d;
}

const sortBtn = document.getElementById('sortMode');

function getModeLabel(mode) {
  return mode === 'first' ? 'First Level 200' : 'Fastest 200';
}

function setSortMode(mode) {
  if (!sortBtn) return;
  sortBtn.dataset.mode = mode;
  sortBtn.textContent = getModeLabel(mode);
  sortBtn.setAttribute('aria-pressed', mode === 'first');
}

function toggleSortMode() {
  const newMode = (sortBtn.dataset.mode === 'first') ? 'fastest' : 'first';
  setSortMode(newMode);
  sortPeople(newMode);
  reorderBoardWithAnimation();
}
if (sortBtn) {
  sortBtn.addEventListener('click', toggleSortMode);
  sortBtn.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      toggleSortMode();
    }
  });
}

const sortDirBtn = document.getElementById('sortDir');
if (sortDirBtn) {
  sortDirBtn.addEventListener('click', () => {
    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
    sortDirBtn.textContent = sortDirection === 'asc' ? '↑' : '↓';
    sortDirBtn.title = sortDirection === 'asc' ? 'Currently ascending' : 'Currently descending';
    sortPeople(sortBtn.dataset.mode);
    reorderBoardWithAnimation();
  });
}

let currentView = 'leaderboard';
const viewToggle = document.getElementById('viewToggle');
const timeline = document.getElementById('timeline');

function renderTimeline() {
  if (!timeline) return;
  timeline.innerHTML = '';
  
  const grouped = {};
  people.forEach(p => {
    const year = p.date.split('/')[2];
    if (!grouped[year]) grouped[year] = [];
    grouped[year].push(p);
  });
  
  const years = Object.keys(grouped).sort((a, b) => 
    sortDirection === 'asc' ? a - b : b - a
  );
  
  years.forEach(year => {
    const section = document.createElement('div');
    section.className = 'timeline-section';
    
    const yearTitle = document.createElement('div');
    yearTitle.className = 'timeline-year';
    yearTitle.textContent = year;
    section.appendChild(yearTitle);
    
    const list = document.createElement('div');
    list.className = 'timeline-list';
    
    grouped[year].forEach((p, idx) => {
      const entry = document.createElement('div');
      entry.className = 'timeline-entry';
      
      const rank = document.createElement('div');
      rank.className = 'timeline-rank';
      rank.textContent = `#${people.indexOf(p) + 1}`;
      entry.appendChild(rank);
      
      const name = document.createElement('div');
      name.className = 'timeline-name';
      name.textContent = p.name;
      entry.appendChild(name);
      
      const date = document.createElement('div');
      date.className = 'timeline-date';
      date.textContent = formatDateDisplay(p.date);
      entry.appendChild(date);
      
      list.appendChild(entry);
    });
    
    section.appendChild(list);
    timeline.appendChild(section);
  });
}

function toggleView() {
  if (currentView === 'leaderboard') {
    currentView = 'timeline';
    board.classList.add('fade-out');
    // hide sort button with animation
    sortBtn.classList.add('hidden');
    // reset card visibility for when we return
    document.querySelectorAll('.card.visible').forEach(card => {
      card.classList.remove('visible');
    });
    setTimeout(() => {
      board.style.display = 'none';
      renderTimeline();
      timeline.style.display = 'block';
      timeline.classList.remove('fade-out');
      timeline.classList.add('fade-in');
    }, 180);
    viewToggle.textContent = 'Leaderboard';
  } else {
    currentView = 'leaderboard';
    timeline.classList.add('fade-out');
    setTimeout(() => {
      timeline.style.display = 'none';
      board.style.display = '';
      board.classList.remove('fade-out');
      board.classList.add('fade-in');
      // show sort button with animation
      sortBtn.classList.remove('hidden');
      // re-setup reveal observer for leaderboard cards
      if (typeof setupRevealObserver === 'function') setupRevealObserver();
    }, 180);
    viewToggle.textContent = 'Timeline';
  }
}

if (viewToggle) {
  viewToggle.addEventListener('click', toggleView);
  viewToggle.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      toggleView();
    }
  });
}

function getInitials(name) {
  if (!name) return '';
  const parts = name.split(/\s+/).filter(Boolean);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

function formatTime(p) {
  if (!p || p.totalDays >= 1e9) return '--';
  const m = Number(p.monthsNum);
  const d = Number(p.daysNum);
  if (isNaN(m) || isNaN(d)) return '--';
  const parts = [];
  if (m > 0 && m < 1e6) parts.push(`${m} month${m === 1 ? '' : 's'}`);
  if (d > 0) parts.push(`${d} day${d === 1 ? '' : 's'}`);
  if (parts.length === 0) return '0 days';
  return parts.join(' ');
}

// format a date string in dd/mm/yyyy into a human readable form like "1 February 2023"
function formatDateDisplay(dateStr) {
  if (!dateStr) return '--';
  const parts = dateStr.split('/').map(s => s.trim());
  if (parts.length !== 3) return dateStr;
  const d = parseInt(parts[0], 10);
  const m = parseInt(parts[1], 10);
  const y = parseInt(parts[2], 10);
  if (isNaN(d) || isNaN(m) || isNaN(y)) return dateStr;
  const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October',
    'November', 'December'
  ];
  const month = monthNames[m-1] || '';
  return `${d} ${month} ${y}`;
}

function sortPeople(mode) {
  const isMissing = p => p.totalDays >= 1e9;

  if (mode === 'fastest') {
    people.sort((a, b) => {
      // always push missing times to the bottom
      if (isMissing(a) && isMissing(b)) return 0;
      if (isMissing(a)) return 1;
      if (isMissing(b)) return -1;

      const cmp = (a.monthsNum - b.monthsNum) || (a.daysNum - b.daysNum) || (parseDateToNumber(a.date) - parseDateToNumber(b.date));
      return sortDirection === 'desc' ? -cmp : cmp;
    });
  } else if (mode === 'first') {
    people.sort((a, b) => {
      // always push missing times to the bottom
      if (isMissing(a) && isMissing(b)) return 0;
      if (isMissing(a)) return 1;
      if (isMissing(b)) return -1;

      const cmp = (parseDateToNumber(a.date) - parseDateToNumber(b.date)) || (parseInt(a.position, 10) - parseInt(b.position, 10)) || (a.id - b.id);
      return sortDirection === 'desc' ? -cmp : cmp;
    });
  }
}

          }
          if (p.banner.image) {
            bannerEl.style.backgroundImage = `url("${p.banner.image}")`;
          }
        }

        card.appendChild(bannerEl);
      }

      const initials = getInitials(p.name);
      const formatted = formatTime(p);

      const rawId = (p.discordId || '').toString().trim();
      const idLower = rawId.toLowerCase();
      const missingSentinels = ['--', '-', 'deleted', 'removed', 'n/a', 'null', ''];
      const isMissing = missingSentinels.includes(idLower);
      const hasId = rawId && !isMissing;
      let idHtml;
      if (hasId) {
        idHtml = `<button class="id-link" aria-label="Copy ID ${rawId}">${rawId}</button>`;
      } else {
        const display = (rawId && rawId !== '--') ? rawId : '—';
        const aria = (rawId && rawId !== '--') ? `aria-label="ID ${rawId}"` : `aria-label="ID missing"`;
        idHtml = `<span class="id-missing" ${aria}>${display}</span>`;
      }

      card.innerHTML += `
       <div class="card-header">
         <div class="avatar" aria-hidden="true" aria-label="${p.name}"></div>
         <div class="meta">
           <div class="username">${p.name}</div>
           <div class="stats"><div class="pill">${formatted}</div></div>
         </div>
       </div>
       <div id="desc-${p.id}" class="desc" role="region" aria-hidden="true">
         <div class="desc-inner centered">
           <strong>Date:</strong> ${formatDateDisplay(p.date)}<br>
           <strong>ID:</strong> ${idHtml}<br>
           <strong>Time:</strong> ${formatTime(p)}
         </div>
       </div>
     `;

      const avatar = card.querySelector('.avatar');

      // optional:show fallback immediately (so no empty flash)
      avatar.style.backgroundImage = `url("${getFallbackDiscordAvatar(p.name)}")`;
      avatar.style.backgroundSize = 'cover';
      avatar.style.backgroundPosition = 'center';
      avatar.textContent = '';

      getDiscordAvatar(p.discordId, p.name, p.img).then(url => {
        avatar.style.backgroundImage = `url("${url}")`;
      });

      const idButtons = card.querySelectorAll('.id-link');
      idButtons.forEach(btn => {
        btn.addEventListener('click', async (e) => {
          try {
            await navigator.clipboard.writeText(p.discordId);
            const orig = btn.textContent;
            btn.textContent = 'Copied';
            setTimeout(() => btn.textContent = orig, 1200);
          } catch (err) {
            console.error('copy failed', err);
          }
        });
      });

      const desc = card.querySelector('.desc');
      const descInner = desc.querySelector('.desc-inner');

      function closeOthers() {
        document.querySelectorAll('.card.show-desc').forEach(c => {
          if (c !== card) {
            c.classList.remove('show-desc');
            const d = c.querySelector('.desc');
            if (d) d.style.maxHeight = '0px';
          }
        });
      }

      let autoScrollActive = false;
      let savedScrollY = null;
      let scrollAnimFrame = null;

      function smoothScrollBy(amount, duration) {
        const start = window.scrollY;
        const target = start + amount;
        const startTime = performance.now();

        function step(now) {
          const elapsed = now-startTime;
          const progress = Math.min(elapsed / duration, 1);
          // ease in-out curve for natural feel
          const ease = progress < 0.5 ?
            2 * progress * progress :
            1-Math.pow(-2 * progress + 2, 2) / 2;
          window.scrollTo(0, start + (target-start) * ease);
          if (progress < 1) scrollAnimFrame = requestAnimationFrame(step);
        }
        if (scrollAnimFrame) cancelAnimationFrame(scrollAnimFrame);
        scrollAnimFrame = requestAnimationFrame(step);
      }

      function smoothScrollTo(target, duration) {
        const start = window.scrollY;
        const startTime = performance.now();

        function step(now) {
          const elapsed = now-startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = progress < 0.5 ?
            2 * progress * progress :
            1-Math.pow(-2 * progress + 2, 2) / 2;
          window.scrollTo(0, start + (target-start) * ease);
          if (progress < 1) scrollAnimFrame = requestAnimationFrame(step);
        }
        if (scrollAnimFrame) cancelAnimationFrame(scrollAnimFrame);
        scrollAnimFrame = requestAnimationFrame(step);
      }

      function showDesc() {
        closeOthers();
        card.classList.add('show-desc');
        card.setAttribute('aria-expanded', 'true');
        desc.setAttribute('aria-hidden', 'false');
        desc.style.maxHeight = descInner.scrollHeight + 24 + 'px';

        setTimeout(() => {
          descInner.style.opacity = 1;
          descInner.style.transform = 'translateY(0)';
        }, 40);

setTimeout(() => {
  const isLastCard = card === board.lastElementChild;

  if (!isLastCard) return; // ✅ only allow bottom card

  const cardRect = card.getBoundingClientRect();
  const expandedBottom = cardRect.bottom + descInner.scrollHeight + 24;
  const viewportHeight = window.innerHeight;

  if (expandedBottom > viewportHeight) {
    savedScrollY = window.scrollY;
    autoScrollActive = true;
    const scrollNeeded = expandedBottom - viewportHeight + 16;
    smoothScrollBy(scrollNeeded, 600);
  }
}, 360);
      }

      function hideDesc() {
        card.classList.remove('show-desc');
        card.setAttribute('aria-expanded', 'false');
        desc.setAttribute('aria-hidden', 'true');
        descInner.style.opacity = 0;
        descInner.style.transform = 'translateY(6px)';
        desc.style.maxHeight = '0px';

        if (autoScrollActive && savedScrollY !== null) {
          if (scrollAnimFrame) cancelAnimationFrame(scrollAnimFrame);
          smoothScrollTo(savedScrollY, 600); // 600ms slow smooth scroll back
          autoScrollActive = false;
          savedScrollY = null;
        }
      }

  card.addEventListener('mouseenter', showDesc);
  card.addEventListener('mouseleave', hideDesc);

  card.addEventListener('click', (e) => {
  if (window.innerWidth <= 768) {
    const isOpen = card.classList.contains('show-desc');
    if (isOpen) hideDesc();
    else showDesc();
  }
});
      card.addEventListener('focusin', showDesc);
      card.addEventListener('focusout', hideDesc);
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          const isOpen = card.classList.contains('show-desc');
          if (isOpen) hideDesc();
          else showDesc();
        }
      });

      board.appendChild(card);
    } catch (err) {
      console.error('renderBoard:failed to render person', p && p.name, p, err);
    }
  });

}

// keep badges & left accents in sync with current DOM order
function updateRanks() {
  Array.from(board.children).forEach((c, i) => {
    c.classList.remove('rank-1', 'rank-2', 'rank-3');
    if (i === 0) c.classList.add('rank-1');
    else if (i === 1) c.classList.add('rank-2');
    else if (i === 2) c.classList.add('rank-3');
    const badge = c.querySelector('.rank-badge');
    if (badge) badge.textContent = `#${i+1}`;
  });
}

// Reorder with FLIP animation when sort mode changes
function reorderBoardWithAnimation() {
  // capture first positions
  const cards = Array.from(board.children);
  const firstRects = new Map();
  cards.forEach(c => {
    firstRects.set(c.dataset.id, c.getBoundingClientRect());
  });

  // append in new order
  const data = people;
  people.forEach(p => {
    const c = board.querySelector(`[data-id="${p.discordId || 'unknown'}"]`);
    if (c) board.appendChild(c);
  });

  // update badges and left-accent classes to reflect new order
  updateRanks();

  // animate from old position to new
  const lastRects = new Map();
  const moved = [];
  Array.from(board.children).forEach(c => {
    const id = c.dataset.id;
    const first = firstRects.get(id);
    const last = c.getBoundingClientRect();
    lastRects.set(id, last);
    const deltaY = first ? first.top-last.top : 0;
    if (deltaY) {
      moved.push({
        c,
        deltaY
      });
    }
  });

  moved.forEach(({
    c,
    deltaY
  }) => {
    c.style.transition = 'none';
    c.style.transform = `translateY(${deltaY}px)`;
    requestAnimationFrame(() => {
      c.style.transition = 'transform .48s cubic-bezier(.2,.8,.2,1)';
      c.style.transform = '';
    });
    const cleanup = () => {
      c.style.transition = '';
      c.style.transform = '';
      c.removeEventListener('transitionend', cleanup);
    };
    c.addEventListener('transitionend', cleanup);
  });
}

// reveal observer for scroll animations
let revealObserver = null;

function setupRevealObserver() {
  try {
    if (revealObserver) revealObserver.disconnect();
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          setTimeout(() => {
            try {
              entry.target.style.transition = '';
              entry.target.classList.add('visible');
            } catch (e) {}
          }, 25);
        } else {
          entry.target.classList.remove('visible');
        }
      });
    }, {
      threshold:0.12
    });
    document.querySelectorAll('.reveal:not(.visible)').forEach(el => {
      try {
        const r = el.getBoundingClientRect();
        const vh = window.innerHeight || document.documentElement.clientHeight;
        if (r.top < vh && r.bottom > 0) {
          setTimeout(() => {
            try {
              el.style.transition = '';
              el.classList.add('visible');
            } catch (e) {}
          }, 25);
        } else {
          revealObserver.observe(el);
        }
      } catch (e) {
        revealObserver.observe(el);
      }
    });
  } catch (err) {
    /* noop */ }
}

catch (err) {
