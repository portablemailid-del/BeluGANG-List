<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeluGANG List</title>
  <style>

:root {
  --card-bg:       rgba(35,39,43,0.96);
  --card-border:   rgba(255,255,255,0.04);
  --text:          #e6eef8;
  --muted:         #aeb8c2;
  --banner-bg:     #111216;
  --pill-bg:       rgba(255,255,255,0.03);
  --desc-bg:       rgba(10,10,10,0.35);
  --card-radius:   12px;
  --banner-height: 84px;
}

html {
  scroll-behavior: smooth;
  overscroll-behavior: none;
  min-height: 100%;
  background:
    linear-gradient(rgba(32,33,32,0.8), rgba(32,33,32,0.8)),
    url('https://cdn.discordapp.com/splashes/846496831533088768/1b728ecdbe543ff9e183605686639dce.jpg?size=4096')
    no-repeat center center / cover fixed;
  background-color: #202120;
}

body {
  font-family: Inter, system-ui, 'Segoe UI', Arial;
  background: transparent;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  overscroll-behavior: none;
  overflow-x: hidden;
}

/* ════════════════════════════════════════════════════
   UNIFIED REVEAL ANIMATION
   Leaderboard cards, timeline entries, viz bar rows.
   Observer adds .visible on enter, removes on exit.
   ════════════════════════════════════════════════════ */

/* Hidden / reset state */
.reveal {
  opacity: 0;
  transform: translateY(6px);
  transition:
    opacity   0.08s linear,
    transform 0.08s linear;
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ── Hover lift (cards only) ── */
.card.reveal.visible {
  transition:
    opacity   0.38s cubic-bezier(0.25, 1, 0.5, 1),
    transform 0.38s cubic-bezier(0.25, 1, 0.5, 1),
    box-shadow 0.22s ease;
  transition-delay: 0ms;
}
.card.reveal.visible:hover {
  transform: translateY(-4px) scale(1.012);
  box-shadow: 0 20px 48px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.07);
}

/* ════════════════ LAYOUT ════════════════ */
.container {
  width: 100%; max-width: 1100px;
  padding: 0 16px 80px;
  margin: calc(var(--banner-height) + 32px) auto 0;
}
.grid { display: grid; grid-template-columns: 1fr; gap: 22px; }

/* ── Banner ── */
.banner {
  position: fixed; top: 0; left: 0;
  width: 100%; height: var(--banner-height);
  background: var(--banner-bg);
  z-index: 1000;
  box-shadow: 0 2px 8px rgba(0,0,0,0.6);
}
.banner-inner {
  position: relative; max-width: 1100px; margin: 0 auto;
  padding: 0 16px; height: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.banner-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; cursor: pointer; }
.banner-divider { color: rgba(230,238,248,0.25); font-size: 1.3rem; font-weight: 300; }
.org { font-weight: 900; color: var(--text); font-size: 1.6rem; padding-left: 6px; }
.title-text { font-size: 1.1rem; font-weight: 600; color: var(--text); white-space: nowrap; }

/* ── Card ── */
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 18px; border-radius: var(--card-radius);
  position: relative; overflow: visible;
  display: flex; flex-direction: column; align-items: stretch;
  box-sizing: border-box; backface-visibility: hidden; contain: layout style;
}

.card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
}

.card-banner {
  position: absolute;
  inset: 0;
  border-radius: 12px;
  z-index: 0;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 6px;
  height: 100%;
  border-radius: 12px 0 0 12px;
  z-index: 10;
  pointer-events: none;
}

.card-banner::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 12px;
  background: rgba(18,19,22,0.78);
  z-index: 1;
}

.user-card:hover {
  transform: scale(1.02);
}

.card.rank-1::before {
  background: linear-gradient(180deg,#FFD700,#FFC107);
}

.card.rank-2::before {
  background: linear-gradient(180deg,#C0C0C0,#A8A8A8);
}

.card.rank-3::before {
  background: linear-gradient(180deg,#CD7F32,#B87333);
}

/* ── Card banner (nameplate bg) ── */
.card-banner {
  position: absolute; inset: 0; border-radius: 12px;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  pointer-events: none; z-index: 0; opacity: 0; transition: opacity .4s ease;
}
.card-banner.loaded { opacity: 1; }
.card-banner::after {
  content: ''; position: absolute; inset: 0; border-radius: 12px;
  background: rgba(18,19,22,0.78); z-index: 1;
}
.card-header, .desc, .rank-badge { position: relative; z-index: 1; }

/* ── Rank badge ── */
.rank-badge {
  position: absolute; top: 12px; right: 12px;
  background: linear-gradient(180deg,#fff,#e6e6e6);
  color: #111827; padding: 6px 10px; border-radius: 999px;
  font-weight: 700; font-size: .85rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18); border: 1px solid rgba(0,0,0,0.06);
  min-width: 44px; text-align: center;
}
.card.rank-1 .rank-badge { background: linear-gradient(180deg,#FFEB99,#FFD54F); }
.card.rank-2 .rank-badge { background: linear-gradient(180deg,#F0F0F0,#CFCFCF); }
.card.rank-3 .rank-badge { background: linear-gradient(180deg,#F3C08A,#E29A5A); }

/* ── Avatar ── */
.avatar-wrap { position: relative; width: 64px; height: 64px; flex: 0 0 64px; }
.avatar {
  width: 64px; height: 64px; border-radius: 50%; flex: 0 0 64px;
  overflow: hidden; border: 1px solid rgba(0,0,0,0.06);
  display: inline-grid; place-items: center;
  background: #fff; color: #111827; font-weight: 700; font-size: 18px; cursor: pointer;
}
.avatar-decoration {
  position: absolute; inset: -10px;
  width: calc(100% + 20px); height: calc(100% + 20px);
  pointer-events: none; z-index: 2;
}

/* ── Status dot ── */
.status-dot {
  position: absolute; bottom: 1px; right: 1px;
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid #23272b; z-index: 3; transition: background-color .3s ease;
}
.status-dot.online  { background: #23a55a; }
.status-dot.idle    { background: #f0b232; }
.status-dot.dnd     { background: #f23f43; }
.status-dot.offline { background: #23272b; border-color: #23272b; }
.status-dot.offline::after { content:''; position:absolute; inset:1px; border-radius:50%; background:#80848e; }
.status-dot.idle::after { content:''; position:absolute; top:-1px; left:3px; width:10px; height:10px; border-radius:50%; background:#23272b; }
.status-dot.dnd::after { content:''; position:absolute; top:50%; left:2px; right:2px; height:2.5px; border-radius:999px; background:#fff; transform:translateY(-50%); }

/* ── Meta ── */
.card-header { display: flex; gap: 14px; align-items: center; }
.meta { flex: 1; }
.username { font-weight: 700; font-size: 1.05rem; color: var(--text); }
.muted    { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
.stats    { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.pill     { background: var(--pill-bg); padding: 8px 12px; border-radius: 999px; font-weight: 700; font-size: 1.12rem; color: var(--muted); }
.custom-state { font-size: 0.78rem; font-weight: 500; color: var(--muted); opacity: 0.7; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.custom-state:empty { display: none; }
.status-label { display: inline-flex; align-items: center; gap: 5px; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-top: 6px; }
.dot-inline { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.dot-inline.online  { background: #23a55a; }
.dot-inline.idle    { background: #f0b232; }
.dot-inline.dnd     { background: #f23f43; }
.dot-inline.offline { background: #80848e; }

/* ── Desc panel ── */
.desc {
  padding: 0; max-height: 0; overflow: hidden;
  border-radius: 10px; background: transparent; border: 1px solid transparent;
  color: var(--text); font-size: 0.92rem; line-height: 1.5;
  transition: max-height .28s cubic-bezier(.34,1.56,.64,1);
}
.desc-inner { opacity: 0; transform: translateY(8px); transition: opacity .2s ease, transform .2s ease; }
.desc-inner.centered { text-align: center; }
.card.show-desc .desc {
  background: var(--desc-bg);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-color: var(--card-border); padding: 12px; margin-top: 12px;
  box-shadow: inset 0 0 16px rgba(46,46,46,0.08), 0 8px 24px rgba(0,0,0,0.3);
}

/* ── Focus dimming ── */
.grid.has-focus .card { opacity: 0.35; filter: blur(2px); transform: scale(0.98); transition: opacity .28s ease, filter .28s ease, transform .28s ease; }
.grid.has-focus .card.focused { opacity: 1; filter: none; transform: scale(1.02); box-shadow: 0 16px 48px rgba(2,6,23,0.6), 0 0 0 2px rgba(255,255,255,0.08); z-index: 10; }

/* ── ID buttons ── */
.id-link { background: transparent; border: 1px solid var(--card-border); color: var(--text); padding: 4px 8px; border-radius: 6px; font-weight: 700; cursor: pointer; font-family: inherit; transition: transform .18s ease, box-shadow .18s ease; }
.id-link:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.25); }
.id-missing { display: inline-block; padding: 4px 10px; border-radius: 6px; background: var(--pill-bg); border: 1px solid var(--card-border); color: var(--text); font-weight: 700; font-size: 0.92rem; cursor: default; }

/* ── View transitions ── */
#board    { transition: opacity .32s cubic-bezier(.34,1.56,.64,1), transform .32s cubic-bezier(.34,1.56,.64,1); }
#timeline { transition: opacity .28s cubic-bezier(.34,1.56,.64,1), transform .28s cubic-bezier(.34,1.56,.64,1); }
#vizbar   { transition: opacity .28s cubic-bezier(.34,1.56,.64,1), transform .28s cubic-bezier(.34,1.56,.64,1); }
#board.fade-out, #timeline.fade-out, #vizbar.fade-out { opacity: 0; transform: translateY(12px) scale(0.97); pointer-events: none; }
#board.fade-in,  #timeline.fade-in,  #vizbar.fade-in  { opacity: 1; transform: translateY(0) scale(1); }

/* ── Timeline ── */
.timeline-section { margin-bottom: 42px; }
.timeline-year { font-size: 1.5rem; font-weight: 900; color: var(--text); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--card-border); text-align: center; }
.timeline-list { display: flex; flex-direction: column; gap: 14px; }
.timeline-entry {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 8px; padding: 14px 16px;
  display: flex; align-items: center; gap: 14px;
}
/* Hover only applies once visible so it doesn't fight the reveal */
.timeline-entry.visible:hover {
  background: var(--desc-bg);
  transform: translateX(4px) !important;
  transition: opacity 0.38s, transform 0.38s, background 0.18s ease;
  transition-delay: 0ms;
}
.timeline-rank { font-weight: 800; min-width: 32px; color: var(--muted); }
.timeline-name { flex: 1; font-weight: 700; color: var(--text); }
.timeline-date { font-size: 0.9rem; color: var(--muted); }

/* ── Viz bar ── */
.viz-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.viz-rank { font-size: 0.75rem; font-weight: 800; color: var(--muted); min-width: 30px; text-align: right; flex-shrink: 0; }
.viz-name { font-size: 0.88rem; font-weight: 700; color: var(--text); min-width: 72px; max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
.viz-bar-wrap { flex: 1; height: 22px; background: var(--pill-bg); border-radius: 6px; overflow: hidden; }
.viz-bar-fill { height: 100%; border-radius: 6px; width: 0%; transition: width .7s cubic-bezier(.34,1.56,.64,1); display: flex; align-items: center; padding-left: 10px; box-sizing: border-box; min-width: 6px; }
.viz-row.rank-1 .viz-bar-fill { background: linear-gradient(90deg,#FFD700,#FFC107); }
.viz-row.rank-2 .viz-bar-fill { background: linear-gradient(90deg,#C0C0C0,#A8A8A8); }
.viz-row.rank-3 .viz-bar-fill { background: linear-gradient(90deg,#CD7F32,#B87333); }
.viz-row:not(.rank-1):not(.rank-2):not(.rank-3) .viz-bar-fill { background: linear-gradient(90deg,#4a5568,#2d3748); }
.viz-bar-label-outside { font-size: 0.75rem; font-weight: 700; color: var(--muted); white-space: nowrap; margin-left: 10px; flex-shrink: 0; width: 140px; }

/* ── Filter FAB ── */
.filter-fab { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.filter-fab-btn {
  background: linear-gradient(180deg,#2c3136,#26292c); color: #e6eef8;
  border: 2px solid rgba(46,46,46,0.3); border-radius: 999px; padding: 12px 20px;
  font-weight: 700; font-size: 0.95rem; cursor: pointer; white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: all .2s cubic-bezier(.34,1.56,.64,1);
}
.filter-fab-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 28px rgba(0,0,0,0.55); }
.filter-dropdown {
  background: linear-gradient(180deg,#2c3136,#26292c); border: 2px solid transparent;
  border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  display: flex; flex-direction: column; min-width: 180px;
  opacity: 0; transform: translateY(-16px) scale(0.9); pointer-events: none;
  transition: all 0.3s cubic-bezier(.34,1.56,.64,1);
}
.filter-dropdown.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; border-color: rgba(43,43,43,0.6); }
.filter-dropdown-label { padding: 8px 16px 4px; font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid var(--card-border); }
.filter-dropdown-item { background: transparent; border: none; color: var(--text); padding: 12px 16px; font-weight: 600; font-size: 0.95rem; cursor: pointer; text-align: left; transition: all .18s ease; border-bottom: 1px solid var(--card-border); }
.filter-dropdown-item:last-child { border-bottom: none; }
.filter-dropdown-item:hover { background: rgba(255,255,255,0.04); transform: translateX(4px); }
.filter-dropdown-item.active { color: #fff; background: rgba(255,255,255,0.06); border-left: 3px solid rgba(255,255,255,0.2); }

/* ── Misc ── */
.sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .card { padding: 16px; border-radius: 14px; }
  .rank-badge { top:10px;right:10px;font-size:0.8rem;padding:5px 8px; }
  .avatar,.avatar-wrap { width:52px;height:52px;flex:0 0 52px; }
  .grid { gap: 16px; }
  .card-header { gap: 10px; }
  .pill { font-size:0.85rem;padding:6px 10px; }
  .muted { font-size:0.8rem; }
  .desc { font-size:0.85rem; }
  .banner-inner { padding:0 10px; flex-wrap:wrap; justify-content:center; gap:6px; }
  .org { width:100%; text-align:center; font-size:1.2rem; }
  .controls { display:flex; gap:6px; justify-content:center; width:100%; }
  .controls .toggle-btn { font-size:0.75rem; padding:6px 8px; }
  .status-dot { width:12px; height:12px; }
  .filter-fab { bottom:16px; right:16px; }
  .filter-fab-btn { padding:10px 14px; font-size:0.85rem; }
  .timeline-entry { padding:10px 12px; gap:10px; }
  .timeline-name { font-size:0.9rem; }
  .timeline-date { font-size:0.8rem; }
  body { overflow-x:hidden; }
}
@media (max-width: 520px) {
  .grid { grid-template-columns:1fr; }
  .avatar,.avatar-wrap { width:48px;height:48px;flex:0 0 48px;font-size:14px; }
  .status-dot { width:11px;height:11px; }
  .viz-name { min-width:52px;max-width:52px;font-size:0.8rem; }
  .viz-bar-wrap { height:18px; }
}
  </style>
</head>
<body>
  <div class="banner">
    <div class="banner-inner">
      <div class="banner-brand" id="brandHome" title="Go to Leaderboard">
        <span class="org">BeluGANG</span>
        <span class="banner-divider">|</span>
        <span class="title-text">Level 200 List</span>
      </div>
      <div class="controls" id="controlsBar">
        <label for="sortMode" class="sr-only">Sort leaderboard</label>
        <button id="sortMode"   class="toggle-btn" aria-label="Toggle sort" data-mode="fastest">Fastest 200</button>
        <button id="viewToggle" class="toggle-btn" style="margin-left:8px">Timeline</button>
        <button id="vizToggle"  class="toggle-btn viz-icon-btn" title="Time Visualization Bar" style="margin-left:8px">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="container" aria-live="polite">
    <div id="board"    class="grid" role="list"></div>
    <div id="timeline" style="display:none"></div>
    <div id="vizbar"   style="display:none"></div>
  </div>

  <div class="filter-fab" id="filterFab">
    <div class="filter-dropdown" id="filterDropdown">
      <div class="filter-dropdown-label">Filter</div>
      <button class="filter-dropdown-item active" data-dir="asc">↑ Ascending</button>
      <button class="filter-dropdown-item"        data-dir="desc">↓ Descending</button>
    </div>
    <button class="filter-fab-btn" id="filterFabBtn">☰</button>
  </div>

<script>

let revealObserver = null;

function setupRevealObserver() {
  if (revealObserver) revealObserver.disconnect();

  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const el = entry.target;
      if (entry.isIntersecting) {
        el.style.transitionDelay = '0ms';
        el.classList.add('visible');
      } else {
        el.classList.remove('visible');
        el.style.transitionDelay = '0ms';
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -24px 0px' });

  document.querySelectorAll('.reveal').forEach(el => {
    revealObserver.observe(el);
    const rect = el.getBoundingClientRect();
    if (rect.top < window.innerHeight && rect.bottom > 0) {
      el.style.transitionDelay = el.dataset.revealDelay || '0ms';
      requestAnimationFrame(() => el.classList.add('visible'));
    }
  });
}

/* ── helpers ─────────────────────────────────────────── */
function getFallbackDiscordAvatar(seed) {
  const s = String(seed || '').trim() || 'fallback';
  let n = 0;
  for (let i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) >>> 0;
  return `https://cdn.discordapp.com/embed/avatars/${n % 6}.png`;
}

function getDominantColor(src) {
  return new Promise(resolve => {
    const img = new Image(); img.crossOrigin = 'Anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 80;
        const ctx = c.getContext('2d'); if (!ctx) { resolve(null); return; }
        ctx.drawImage(img, 0, 0, 80, 80);
        const d = ctx.getImageData(0, 0, 80, 80).data;
        let r = 0, g = 0, b = 0, cnt = 0;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] > 128) { r += d[i]; g += d[i+1]; b += d[i+2]; cnt++; }
        }
        resolve(cnt ? `rgb(${Math.round(r/cnt)},${Math.round(g/cnt)},${Math.round(b/cnt)})` : null);
      } catch(e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function getDiscordProfile(id, name, img) {
  if (!id || !/^[0-9]+$/.test(id))
    return { avatarUrl: getFallbackDiscordAvatar(name), decorationUrl: null, status: null, customState: null, nameplateUrl: null, nameplateColor: null };
  try {
    const res  = await fetch(`https://api.lanyard.rest/v1/users/${id}`);
    const json = await res.json();
    const data = json?.data, user = data?.discord_user;
    const ah = user?.avatar;
    const avatarUrl = ah
      ? `https://cdn.discordapp.com/avatars/${id}/${ah}.png?size=512`
      : (img || getFallbackDiscordAvatar(name));
    const da = user?.avatar_decoration_data?.asset;
    const decorationUrl = da ? `https://cdn.discordapp.com/avatar-decoration-presets/${da}.png` : null;
    const na = user?.collectibles?.nameplate?.asset || null;
    const nameplateUrl = na ? `https://cdn.discordapp.com/assets/collectibles/${na}static.png` : null;
    const nameplateColor = nameplateUrl ? await getDominantColor(nameplateUrl) : null;
    const status = data?.discord_status || null;
    const customState = (data?.activities || []).find(a => a.type === 4)?.state || null;
    return { avatarUrl, decorationUrl, status, customState, nameplateUrl, nameplateColor };
  } catch(e) {}
  return { avatarUrl: img || getFallbackDiscordAvatar(name), decorationUrl: null, status: null, customState: null, nameplateUrl: null, nameplateColor: null };
}

function showErrorOverlay(msg) {
  let ov = document.getElementById('error-overlay');
  if (!ov) {
    ov = document.createElement('div'); ov.id = 'error-overlay';

function parseTime(t) {
  if (!t || t.includes('--')) return { monthsNum:1e6, daysNum:1e6, totalDays:1e9 };
  const b = t.split('/').map(s => s.trim());
  const m = parseInt(b[0], 10), d = parseInt(b[1], 10);
  const mn = isNaN(m) ? 1e6 : m, dn = isNaN(d) ? 0 : d;
  return { monthsNum: mn, daysNum: dn, totalDays: mn * 30 + dn };
}
function parseDateToNumber(s) {
  if (!s) return 99999999;
  const p = s.split('/').map(x => x.trim());
  if (p.length !== 3) return 99999999;
  const d = parseInt(p[0],10), m = parseInt(p[1],10), y = parseInt(p[2],10);
  if (isNaN(d)||isNaN(m)||isNaN(y)) return 99999999;
  return y*10000 + m*100 + d;
}
function formatTime(p) {
  if (!p || p.totalDays >= 1e9) return '--';
  const m = Number(p.monthsNum), d = Number(p.daysNum);
  if (isNaN(m)||isNaN(d)) return '--';
  const parts = [];
  if (m > 0 && m < 1e6) parts.push(`${m} month${m === 1 ? '' : 's'}`);
  if (d > 0) parts.push(`${d} day${d === 1 ? '' : 's'}`);
  return parts.length ? parts.join(' ') : '0 days';
}
function formatDateDisplay(s) {
  if (!s) return '--';
  const p = s.split('/').map(x => x.trim());
  if (p.length !== 3) return s;
  const d = parseInt(p[0],10), m = parseInt(p[1],10), y = parseInt(p[2],10);
  if (isNaN(d)||isNaN(m)||isNaN(y)) return s;
  const mn = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${d} ${mn[m-1]||''} ${y}`;
}
function getInitials(name) {
  if (!name) return '';
  const p = name.split(/\s+/).filter(Boolean);
  return p.length === 1 ? p[0].slice(0,2).toUpperCase() : (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
}

function sortPeople(mode) {
  const miss = p => p.totalDays >= 1e9;
  if (mode === 'fastest') {
    people.sort((a, b) => {
      if (miss(a) && miss(b)) return 0; if (miss(a)) return 1; if (miss(b)) return -1;
      const c = (a.monthsNum - b.monthsNum) || (a.daysNum - b.daysNum) || (parseDateToNumber(a.date) - parseDateToNumber(b.date));
      return sortDirection === 'desc' ? -c : c;
    });
  } else {
    people.sort((a, b) => {
      if (miss(a) && miss(b)) return 0; if (miss(a)) return 1; if (miss(b)) return -1;
      const c = (parseDateToNumber(a.date) - parseDateToNumber(b.date)) || (parseInt(a.position,10) - parseInt(b.position,10)) || (a.id - b.id);
      return sortDirection === 'desc' ? -c : c;
    });
  }
}

      badge.textContent = `#${index + 1}`;
      card.appendChild(badge);

      const bannerEl = document.createElement('div');
      bannerEl.className = 'card-banner';
      card.appendChild(bannerEl);

      const rawId  = (p.discordId || '').toString().trim();
      const miss   = ['--','-','deleted','removed','n/a','null',''].includes(rawId.toLowerCase());
      const idHtml = !miss
        ? `<button class="id-link" aria-label="Copy ID ${rawId}">${rawId}</button>`
        : `<span class="id-missing" aria-label="ID missing">${rawId && rawId !== '--' ? rawId : '—'}</span>`;

      card.innerHTML += `
        <div class="card-header">

            <div class="stats"><div class="pill">${formatTime(p)}</div></div>
          </div>
        </div>
        <div class="desc" role="region" aria-hidden="true">
          <div class="desc-inner centered">
            <strong>Date:</strong> ${formatDateDisplay(p.date)}<br>
            <strong>ID:</strong> ${idHtml}<br>
            <strong>Time:</strong> ${formatTime(p)}<br>
            <span class="status-label" data-status-label></span>
          </div>
        </div>`;

      const avatar     = card.querySelector('.avatar');
      const avatarWrap = card.querySelector('.avatar-wrap');
      avatar.style.cssText = `background-image:url("${getFallbackDiscordAvatar(p.name)}");background-size:cover;background-position:center;`;

      getDiscordProfile(p.discordId, p.name, p.img)
        .then(profile => applyProfile(card, avatarWrap, avatar, p, profile));

      card.querySelectorAll('.id-link').forEach(btn => {
        btn.addEventListener('click', async e => {
          e.stopPropagation();
          try {
            await navigator.clipboard.writeText(p.discordId);
            const o = btn.textContent; btn.textContent = 'Copied';
            setTimeout(() => btn.textContent = o, 1200);
          } catch(err) {}
        });
      });

      const desc      = card.querySelector('.desc');
      const descInner = desc.querySelector('.desc-inner');
      let autoScrollActive = false, savedScrollY = null, rafId = null;

      function easedScrollTo(target, dur) {
        const start = window.scrollY, t0 = performance.now();
        function step(now) {
          const prog = Math.min((now - t0) / dur, 1);
          const ease = prog < 0.5 ? 2*prog*prog : 1 - Math.pow(-2*prog+2, 2)/2;
          window.scrollTo(0, start + (target - start) * ease);
          if (prog < 1) rafId = requestAnimationFrame(step);
        }
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(step);
      }

      function closeOthers() {
        document.querySelectorAll('.card.show-desc').forEach(c => {
          if (c === card) return;
          c.classList.remove('show-desc', 'focused');
          const d = c.querySelector('.desc'), di = c.querySelector('.desc-inner');
          if (d) d.style.maxHeight = '0px';
          if (di) { di.style.opacity = 0; di.style.transform = 'translateY(6px)'; }
        });
        board.classList.remove('has-focus');
      }

      function showDesc() {
        closeOthers();
        card.classList.add('show-desc', 'focused');
        board.classList.add('has-focus');
        desc.setAttribute('aria-hidden', 'false');
        desc.style.maxHeight = descInner.scrollHeight + 24 + 'px';
        setTimeout(() => { descInner.style.opacity = 1; descInner.style.transform = 'translateY(0)'; }, 40);
        setTimeout(() => {
          if (card !== board.lastElementChild) return;
          const eb = card.getBoundingClientRect().bottom + descInner.scrollHeight + 24;
          if (eb > window.innerHeight) {
            savedScrollY = window.scrollY; autoScrollActive = true;
            easedScrollTo(window.scrollY + (eb - window.innerHeight + 16), 600);
          }
        }, 360);
      }

      function hideDesc() {
        card.classList.remove('show-desc', 'focused');
        board.classList.remove('has-focus');
        desc.setAttribute('aria-hidden', 'true');
        descInner.style.opacity = 0; descInner.style.transform = 'translateY(6px)';
        desc.style.maxHeight = '0px';
        if (autoScrollActive && savedScrollY !== null) {
          if (rafId) cancelAnimationFrame(rafId);
          easedScrollTo(savedScrollY, 600);
          autoScrollActive = false; savedScrollY = null;
        }
      }

      card.addEventListener('click',   e => { if (e.target.closest('.id-link')) return; card.classList.contains('show-desc') ? hideDesc() : showDesc(); });
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.classList.contains('show-desc') ? hideDesc() : showDesc(); } });

      board.appendChild(card);
    } catch(err) { console.error('render card failed', p?.name, err); }
  });

  // Kick the unified observer after DOM is populated
  setTimeout(setupRevealObserver, 20);
}

function updateRanks() {
  Array.from(board.children).forEach((c, i) => {
    c.classList.remove('rank-1','rank-2','rank-3');

    else if (i === 1) c.classList.add('rank-2');
    else if (i === 2) c.classList.add('rank-3');
    const b = c.querySelector('.rank-badge'); if (b) b.textContent = `#${i+1}`;
    c.dataset.revealDelay = `${Math.min(i * 40, 280)}ms`;
  });
}

function reorderBoardWithAnimation() {
  const cards = Array.from(board.children), firstRects = new Map();
  cards.forEach(c => firstRects.set(c.dataset.id, c.getBoundingClientRect()));
  people.forEach(p => { const c = board.querySelector(`[data-id="${p.discordId||'unknown'}"]`); if (c) board.appendChild(c); });
  updateRanks();
  Array.from(board.children).forEach(c => {
    const first = firstRects.get(c.dataset.id), last = c.getBoundingClientRect();
    const dy = first ? first.top - last.top : 0;
    if (!dy) return;
    c.style.transition = 'none'; c.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => { c.style.transition = 'transform .46s cubic-bezier(.2,.8,.2,1)'; c.style.transform = ''; });
    c.addEventListener('transitionend', function h() { c.style.transition = ''; c.style.transform = ''; c.removeEventListener('transitionend', h); });
  });
}

/* ── viz bar render ───────────────────────────────────── */
function renderVizBar() {
  vizbar.innerHTML = '';
  const known   = people.filter(p => p.totalDays < 1e9).slice().sort((a, b) => a.totalDays - b.totalDays);
  const unknown = people.filter(p => p.totalDays >= 1e9);
  const maxD = known.length ? known[known.length-1].totalDays : 1;
  const minD = known.length ? known[0].totalDays : 0;

  function makeRow(p, rankOverride) {
    const row = document.createElement('div');
    row.className = 'viz-row reveal';
    const sr = known.indexOf(p) + 1;
    if (sr === 1) row.classList.add('rank-1'); else if (sr === 2) row.classList.add('rank-2'); else if (sr === 3) row.classList.add('rank-3');
    row.style.setProperty('--reveal-delay', `${Math.min(rankOverride * 30, 240)}ms`);

    const re = document.createElement('div'); re.className = 'viz-rank'; re.textContent = `#${rankOverride}`; row.appendChild(re);
    const ne = document.createElement('div'); ne.className = 'viz-name'; ne.textContent = p.name; ne.title = p.name; row.appendChild(ne);
    const wrap = document.createElement('div'); wrap.className = 'viz-bar-wrap';
    const fill = document.createElement('div'); fill.className = 'viz-bar-fill';
    if (p.nameplateUrl)    { fill.style.backgroundImage = `url("${p.nameplateUrl}")`; fill.style.backgroundSize = 'cover'; }
    else if (p.nameplateColor) { fill.style.background = p.nameplateColor; }
    const pct = maxD === minD ? 100 : 8 + ((p.totalDays - minD) / (maxD - minD)) * 92;
    fill.style.width = '0%';
    setTimeout(() => { fill.style.width = pct.toFixed(1) + '%'; }, 60);
    wrap.appendChild(fill); row.appendChild(wrap);
    const lbl = document.createElement('span'); lbl.className = 'viz-bar-label-outside'; lbl.textContent = formatTime(p); row.appendChild(lbl);
    return row;
  }

  known.forEach((p, i) => vizbar.appendChild(makeRow(p, i + 1)));
  unknown.forEach(p => {
    const row = document.createElement('div'); row.className = 'viz-row reveal';
    const origRank = people.indexOf(p) + 1;
    row.style.setProperty('--reveal-delay', `${Math.min(origRank * 30, 240)}ms`);
    const re = document.createElement('div'); re.className = 'viz-rank'; re.textContent = `#${origRank}`; row.appendChild(re);
    const ne = document.createElement('div'); ne.className = 'viz-name'; ne.textContent = p.name; row.appendChild(ne);
    const wrap = document.createElement('div'); wrap.className = 'viz-bar-wrap';
    const ef   = document.createElement('div'); ef.className = 'viz-bar-fill'; ef.style.width = '0%'; wrap.appendChild(ef); row.appendChild(wrap);
    const nt   = document.createElement('span'); nt.className = 'viz-bar-label-outside';
    nt.style.cssText = 'color:#7a8490;font-style:italic;opacity:0.7';
    nt.textContent = `Reached on ${formatDateDisplay(p.date)}`; row.appendChild(nt);
    vizbar.appendChild(row);
  });

  setTimeout(setupRevealObserver, 20);
}

/* ── filter fab ───────────────────────────────────────── */
const filterFabBtn  = document.getElementById('filterFabBtn');
const filterDropdown = document.getElementById('filterDropdown');
filterFabBtn.addEventListener('click', e => { e.stopPropagation(); filterDropdown.classList.toggle('open'); });
document.addEventListener('click', e => {
  if (!filterFabBtn.contains(e.target) && !filterDropdown.contains(e.target)) filterDropdown.classList.remove('open');
  if (!e.target.closest('#board .card')) {
    document.querySelectorAll('.card.show-desc').forEach(c => {
      c.classList.remove('show-desc','focused'); c.setAttribute('aria-expanded','false');
      const d = c.querySelector('.desc'), di = c.querySelector('.desc-inner');
      if (d) d.style.maxHeight = '0px';
      if (di) { di.style.opacity = 0; di.style.transform = 'translateY(6px)'; }
    });
    board.classList.remove('has-focus');
  }
});
filterDropdown.querySelectorAll('.filter-dropdown-item').forEach(item => {
  item.addEventListener('click', e => {
    e.stopPropagation(); sortDirection = item.dataset.dir;
    filterDropdown.querySelectorAll('.filter-dropdown-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active'); filterDropdown.classList.remove('open');
    sortPeople(sortBtn.dataset.mode);
    if (currentView === 'timeline') renderTimeline(); else reorderBoardWithAnimation();
  });
});

/* ── injected toggle-btn styles ───────────────────────── */
const s = document.createElement('style');
s.textContent = `
.controls .toggle-btn {
  background: linear-gradient(180deg,#15171a,#1f2023);
  color: #e6eef8; border: 2px solid rgba(46,46,46,0.4);
  padding: 8px 18px; border-radius: 12px; font-weight: 700;
  cursor: pointer; display: inline-block; min-width: 120px;
  transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease,
              opacity .28s ease, visibility .28s ease;
}
.controls .toggle-btn:hover { border-color: rgba(255,255,255,0.18); box-shadow: 0 0 12px rgba(255,255,255,0.06); transform: translateY(-2px); }
.controls .toggle-btn.hidden { opacity:0; transform:translateY(8px) scale(0.95); visibility:hidden; pointer-events:none; }
.controls .toggle-btn:focus { outline: 3px solid rgba(255,255,255,0.1); outline-offset: 2px; }
.controls .viz-icon-btn { min-width:unset!important; width:42px!important; height:42px!important; padding:0!important; display:inline-flex!important; align-items:center; justify-content:center; border-radius:12px!important; flex-shrink:0; }
.controls .viz-icon-btn.active { background:linear-gradient(180deg,#2a2d32,#222528)!important; border-color:rgba(255,255,255,0.18)!important; }
`;
document.head.appendChild(s);

/* ── live status refresh (10s) ────────────────────────── */
let isScrolling = false;
window.addEventListener('scroll', () => { isScrolling = true; clearTimeout(window._st); window._st = setTimeout(() => { isScrolling = false; }, 150); }, { passive: true });

setInterval(async () => {
  if (isScrolling) return;
  for (const card of document.querySelectorAll('.card')) {
    const id = card.dataset.id; if (!id || id === 'unknown') continue;
    const profile = await getDiscordProfile(id);
    const avatar     = card.querySelector('.avatar');
    const avatarWrap = card.querySelector('.avatar-wrap');
    if (avatar && avatarWrap) applyProfile(card, avatarWrap, avatar, people.find(p => (p.discordId||'').toString() === id) || {}, profile);
  }
}, 10000);

/* ── init ─────────────────────────────────────────────── */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.scrollTo(0, 0);
setSortMode('first'); sortPeople('first');
try { renderBoard(); updateRanks(); }
catch(err) { showErrorOverlay('Init render failed: ' + (err?.message || String(err))); }
</script>
</body>
